[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stem-midi-pro"
version = "0.1.0"
description = "Mamba-SSM-based guitar/bass stem separation with MIDI transcription (CPU-only target)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    # Kept in sync with requirements.txt (DEP-4.1). torch<2.4 wheels do not
    # exist for Python 3.13; 2.5+ ships cp313 wheels.
    "torch>=2.5.0,<3.0.0",
    # torchaudio is NOT a hard dependency: production code does not import it.
    # It is only used by research/mamba3_per_track/ and by tests via importorskip.
    # Install via the `research` extra if needed: pip install "stem-midi-pro[research]"
    # mamba-ssm is intentionally NOT a hard dependency: it requires CUDA/nvcc
    # to build. models/_mamba_compat.py falls back to a pure-PyTorch Mamba.
    "librosa>=0.10.0,<0.11.0",
    "soundfile>=0.12.0",
    "mido>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    # numpy 2.1.0 is the first release with cp313 wheels
    "numpy>=2.1.0,<3.0.0",
    "tqdm>=4.65.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    # auraloss: used only by research/mamba3_per_track/ — NOT a hard dependency.
    # Available via the `research` extra: pip install "stem-midi-pro[research]"
    # opentelemetry-*: planned (TODO API-6.19) but not imported anywhere yet.
    # Available via the `research` extra.
]

[project.optional-dependencies]
# CPU-only target (bare-metal i5). CPU wheels of torch for the pinned range.
cpu = [
    "torch>=2.5.0,<3.0.0",
]
# Research extras (auraloss, torchaudio, opentelemetry-*) — not required for
# production CPU inference. Install with: pip install "stem-midi-pro[research]"
research = [
    "auraloss>=0.4.0",
    "torchaudio>=2.5.0,<3.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.scripts]
stem-midi-api = "api:main"
stem-midi-cli = "main:cli"

[tool.setuptools.packages.find]
include = ["models*", "utils*", "data*", "audio*"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["research", "venv", "mamba"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py313"]
# Regex (black's format is not a list). Mirrors ruff's extend-exclude:
# research/ is as-is vendored code; venvs are not source.
extend-exclude = '''/(research|venv|\\.venv[^/]*)/'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = "research/|venv/|mamba/"
