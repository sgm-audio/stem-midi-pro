# T-8.1.2: pytest configuration
[pytest]
testpaths = tests
addopts = -ra --strict-markers --tb=short
markers =
    slow: long-running performance/smoke tests (deselect with -m "not slow")
    cuda: tests requiring CUDA hardware (deselect with -m "not cuda")
    integration: end-to-end API tests
