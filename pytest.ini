# T-8.1.2: pytest configuration
[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config --tb=short
markers =
    slow: long-running performance/smoke tests (deselect with -m "not slow")
    cuda: tests requiring CUDA hardware (deselect with -m "not cuda")
    integration: end-to-end API tests
    real_mamba: exercises the real separator/transcriber modules on CPU (pure-torch Mamba). NEVER allowed to skip for a missing optional dependency; a skip here is a suite-honesty failure (see tests/conftest.py).
    requires_mamba_ssm: needs the CUDA-built mamba-ssm package. Skipped on CPU-only hosts, and hard-failed when the package is importable but the test did not run (--fail-on-skip, enforced in CI's mamba-ssm job).
    memory: peak-RSS / RAM-budget tests against the 4-8 GB CPU target
    property: randomized property-style tests (seeded; hypothesis-based ones skip only when hypothesis is absent AND --strict-deps is off)
