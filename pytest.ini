[pytest]
testpaths = tests
addopts = -ra --strict-markers --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    cuda: marks tests as requiring CUDA (deselect with '-m "not cuda"')
    integration: marks tests as integration tests
