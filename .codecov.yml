# T-8.4.2: Codecov configuration — target 80%, allow 5% drop on new PRs.
coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 80%
        threshold: 5%
        if_ci_failed: error
    patch:
      default:
        target: 80%
        threshold: 5%
        if_ci_failed: error
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
ignore:
  - "tests/**/*"
  - "research/**/*"
  - "demo.py"
  - "verify_structure.py"
  - "check_syntax.py"
