# StemMidiModel Config: Stem+MIDI Pro v1.0
name: "stem_midi_mamba_v1"
restore_from_path: null  # For fine-tuning

# Explicit backend selection. The native Mamba implementation uses the
# pure-PyTorch fallback when mamba_ssm is unavailable.
backends:
  separator: mamba
  transcriber: mamba
  device: cpu

# Audio I/O
audio:
  sample_rate: 44100
  n_fft: 2048
  hop_length: 512        # ~11.6ms @ 44.1kHz audio-frame grid; not a latency certification
  n_mels: 80
  chunk_duration_sec: 2.0
  overlap_ratio: 0.5     # 50% waveform overlap-add; boundary quality needs validation

# Mamba Separator Architecture
# (CPU-only target: mamba-ssm reference impl — no custom CUDA kernels)
separator:
  d_model: 768
  n_layers: 12
  d_state: 16
  d_conv: 4
  expand: 2
  # softmax (default) => the three masks sum to 1, so guitar+bass+residual
  # reconstruct the mix (C-1). "independent" restores per-stem sigmoids.
  mask_normalization: softmax

# Mamba Transcriber Architecture  
transcriber:
  d_model: 512
  n_layers: 8
  d_state: 12
  onset_head_dim: 64
  pitch_vocab_size: 128        # MIDI 0-127 + silence
  velocity_bins: 128
  expression_heads: ["bend", "vibrato", "slide"]
  onset_threshold: 0.5
  min_note_seconds: 0.05
  max_note_seconds: 4.0
  # Chord-aware decoding: every pitch whose sigmoid exceeds this fires
  # its own note_on at an accepted onset frame; null = legacy single-argmax.
  pitch_threshold: 0.5

# Mixed Precision & Distributed
training:
  precision: "fp32"            # CPU-only target — FP8/TransformerEngine require CUDA
  gradient_checkpointing: true # Enable for 60s+ sequences
  megatron_core:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    distributed_timeout_minutes: 30

# Loss Weights
loss:
  mr_stft_weight: 1.0
  spectral_flatness_weight: 0.1
  crest_factor_weight: 0.05
  onset_f1_weight: 1.0
  pitch_ce_weight: 0.8
  velocity_mae_weight: 0.3
  duration_iou_weight: 0.5
  cross_modal_alignment_weight: 0.5

# Quality Gates
quality_gates:
  studio_confidence_threshold: 0.85
  draft_confidence_threshold: 0.70
  min_confidence: 0.6
  min_separation_proxy: 20.0  # deprecated metadata only; proxy is not a tier gate or SI-SDR
  # min_centroid_separation_db / min_si_sdr remain accepted aliases
  # (utils/quality_gates.py:QualityGateConfig reads them in that order).

# Inference (added by PR #13's merge): both keys are read by product code.
inference:
  segment_seconds: 60.0  # main._transcribe_segmented: bound peak memory on long input
  allow_untrained_model: false  # api.load_model refuses random weights unless this or
      # ALLOW_UNTRAINED_MODEL=1 is set (H-6); /ready reports trained_weights either way.

# Export
# [REMOVED: TensorRT-LLM export block — TensorRT-LLM requires CUDA; target is CPU-only]

# MIDI export
midi:
  # Beat grid for the exported files: "auto" estimates the tempo from the audio
  # (utils/tempo.py) and falls back to 120 BPM when there is no measurable
  # pulse; "fixed" always writes 120 BPM; a number is read as BPM.
  tempo: auto
  # The expression head is untrained, so its values are not exported unless a
  # caller asks for them explicitly.
  include_expression: false
