# Stem+MIDI Pro Model Config — CPU-only target (Python 3.13, 4–8 GB RAM)
# All CUDA-era keys (FP8/TensorRT/megatron_core/restore_from_path) were removed:
# they were read by nothing and described the removed GPU path.
name: "stem_midi_mamba_v1"

# Audio I/O
audio:
  sample_rate: 44100
  n_fft: 2048
  hop_length: 512        # ~11.6ms @ 44.1kHz
  n_mels: 80
  chunk_duration_sec: 2.0
  overlap_ratio: 0.5     # overlap-add crossfade for chunked separation
  # Loud memory guard (C-1/C-6): process_audio_file refuses longer inputs
  # instead of OOM-ing the 4–8 GB reference machine. Raise knowingly.
  max_input_seconds: 600

# Pluggable backends (optional; H-9). When present, models/backends/factory.py
# builds these instead of the built-in Mamba modules (extras: `pretrained`).
# backends:
#   separator: demucs       # mamba | demucs | fake
#   transcriber: basic_pitch  # mamba | basic_pitch | fake
#   demucs_model: htdemucs

# Mamba Separator Architecture
# (CPU-only target: pure-PyTorch Mamba fallback in models/_mamba_compat.py,
#  or the mamba-ssm CUDA package when installed on a CUDA machine.)
separator:
  d_model: 768
  n_layers: 12
  d_state: 16
  d_conv: 4
  expand: 2

# Mamba Transcriber Architecture
# NOTE: pitch_vocab_size is 128 MIDI pitches (0-127). There is NO silence
# class — frames without an onset are excluded via onset thresholding.
transcriber:
  d_model: 512
  n_layers: 8
  d_state: 12
  d_conv: 4
  expand: 2
  pitch_vocab_size: 128        # MIDI pitches 0-127
  expression_heads: ["bend", "vibrato", "slide"]
  onset_threshold: 0.5

# Training
training:
  precision: "fp32"            # CPU-only target
  # Actually honored: Mamba blocks wrap themselves in torch.utils.checkpoint
  # when training (C-1) — bounds activation memory to one block.
  gradient_checkpointing: true

# Loss Weights
loss:
  mr_stft_weight: 1.0
  spectral_flatness_weight: 0.1
  crest_factor_weight: 0.05
  onset_f1_weight: 1.0
  pitch_ce_weight: 0.8
  velocity_mae_weight: 0.3
  duration_iou_weight: 0.5   # inert: no dataset emits duration targets yet (ARCH-11.5.2)
  cross_modal_alignment_weight: 0.5

# Quality Gates
quality_gates:
  studio_confidence_threshold: 0.85
  draft_confidence_threshold: 0.70
  min_confidence: 0.6
  min_centroid_separation_db: 20.0  # renamed from min_si_sdr (C-2.6)
