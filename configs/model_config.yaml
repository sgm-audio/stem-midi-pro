# Stem+MIDI Pro v1.0 — CPU-only config (bare-metal i5, 4-8 GB DDR4)
name: "stem_midi_mamba_v1"
restore_from_path: null

# Audio I/O
audio:
  sample_rate: 44100
  n_fft: 2048
  hop_length: 512
  n_mels: 80
  chunk_duration_sec: 2.0
  overlap_ratio: 0.5

# Mamba Separator Architecture
separator:
  d_model: 768
  n_layer: 12
  d_state: 16
  d_conv: 4
  expand: 2

# Mamba Transcriber Architecture
transcriber:
  d_model: 512
  n_layer: 8
  d_state: 12
  onset_head_dim: 64
  pitch_vocab_size: 128
  velocity_bins: 128
  expression_heads: ["bend", "vibrato", "slide"]
  onset_threshold: 0.5

# Training (CPU-only, fp32)
training:
  precision: "fp32"  # CPU target — no FP8/FP16
  gradient_checkpointing: true

# Loss Weights
loss:
  mr_stft_weight: 1.0
  spectral_flatness_weight: 0.1
  crest_factor_weight: 0.05
  onset_f1_weight: 1.0
  pitch_ce_weight: 0.8
  velocity_mae_weight: 0.3
  cross_modal_alignment_weight: 0.5

# Quality Gates
quality_gates:
  studio_confidence_threshold: 0.85
  draft_confidence_threshold: 0.70
  min_confidence: 0.6
  min_si_sdr: 20.0

# [REMOVED: TensorRT-LLM export — requires CUDA, not applicable to CPU target]
# [REMOVED: selective_scan_impl / causal_conv1d_impl — invalid kwargs for Mamba-1.x]