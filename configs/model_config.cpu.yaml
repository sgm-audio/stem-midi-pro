# SPDX-License-Identifier: Apache-2.0
# Stem+MIDI Pro v1.0 — CPU-oriented config (bare-metal i5 target)
# Selects Demucs + Basic Pitch. Install their optional packages and provide
# a separately evaluated checkpoint/model cache; this repository ships neither.
name: "stem_midi_pro_v1_cpu"
restore_from_path: null

backends:
  separator: demucs
  transcriber: basic_pitch
  weights_source: pretrained_dependencies
  device: cpu
  demucs_model: htdemucs
  demucs_shifts: 1
  demucs_split: true
  demucs_progress: false

audio:
  sample_rate: 44100
  n_fft: 2048
  hop_length: 512
  n_mels: 80
  chunk_duration_sec: 2.0
  overlap_ratio: 0.5

separator:
  d_model: 256
  n_layer: 6
  d_state: 12
  d_conv: 4
  expand: 2
  # softmax (default) => the three masks sum to 1, so guitar+bass+residual
  # reconstruct the mix (C-1). "independent" restores per-stem sigmoids.
  mask_normalization: softmax

transcriber:
  d_model: 256
  n_layer: 4
  d_state: 12
  onset_head_dim: 64
  pitch_vocab_size: 128
  velocity_bins: 128
  expression_heads: ["bend", "vibrato", "slide"]
  onset_threshold: 0.5
  min_note_seconds: 0.05
  max_note_seconds: 4.0
  # Chord-aware decoding: every pitch whose sigmoid exceeds this fires
  # its own note_on at an accepted onset frame; null = legacy single-argmax.
  pitch_threshold: 0.5
  # Content gate (TRANS-1): a fired onset also needs energy in its frame, measured as
  # `energy >= content_floor * (loudest frame in this stem)`. Level-independent by
  # construction, so a quiet take is not gated away. 0 disables the gate; outside
  # [0, 1] is a config error, not an empty render.
  content_floor: 0.001

training:
  precision: "fp32"
  gradient_checkpointing: true

loss:
  mr_stft_weight: 1.0
  spectral_flatness_weight: 0.1
  crest_factor_weight: 0.05
  onset_f1_weight: 1.0
  pitch_ce_weight: 0.8
  velocity_mae_weight: 0.3
  cross_modal_alignment_weight: 0.5
  # CONF-1: trains the confidence head against per-frame onset correctness.
  # Without this the head is never updated from its random init.
  confidence_share: 0.1

quality_gates:
  studio_confidence_threshold: 0.85
  draft_confidence_threshold: 0.70
  min_confidence: 0.6
  # GATE-4: reported separation is mask CROSSTALK (0 = perfect, 0.667 = a flat
  # one-third mask that separates nothing). Lower is better, so this is a ceiling.
  # `null` disables. min_separation_proxy below is legacy metadata only.
  max_separation_crosstalk: 0.60
  min_separation_proxy: 20.0  # deprecated metadata only; proxy is not a tier gate or SI-SDR
  # min_centroid_separation_db / min_si_sdr remain accepted aliases
  # (utils/quality_gates.py:QualityGateConfig reads them in that order).

# Inference (added by PR #13's merge): both keys are read by product code.
inference:
  segment_seconds: 60.0  # main._transcribe_segmented: bound peak memory on long input
  allow_untrained_model: false  # api.load_model refuses random weights unless this or
      # ALLOW_UNTRAINED_MODEL=1 is set (H-6); /ready reports trained_weights either way.

# MIDI export (EXPR-1): the expression head is untrained, so exporting it is
# opt-in. Stated explicitly here rather than relying on the code default.
midi:
  include_expression: false
