name: Bug Report
description: Report a bug in Stem+MIDI Pro
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to trigger the bug
      placeholder: |
        1. Run `python main.py --audio test.wav`
        2. See error...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: Windows 11 / Ubuntu 22.04 / macOS 14
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13"
  - type: textarea
    id: traceback
    attributes:
      label: Error traceback
      description: Paste the full error message
      render: python
