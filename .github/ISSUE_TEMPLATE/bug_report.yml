name: Bug report
description: Report a bug in Stem+MIDI Pro
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. 0.1.0 or commit SHA
  - type: textarea
    id: logs
    attributes:
      label: Logs / tracebacks
      render: shell
  - type: checkboxes
    id: env
    attributes:
      label: Environment
      options:
        - label: CPU-only (no CUDA)
        - label: Docker
        - label: Windows
        - label: Linux
