name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint tools
        run: pip install ruff black mypy
      - name: Ruff
        run: ruff check .
      - name: Black (check)
        run: black --check .
      - name: Mypy (loose)
        run: mypy . || true

  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # Correctness gate. This MUST be able to fail the build: a red test suite is
      # the thing we are shipping against. `--strict-deps` turns "optional
      # dependency missing" skips into failures, and `--fail-on-skip` fails the
      # session when a `real_mamba` (must-run) test is skipped — that marker tier
      # covers models/mamba_separator.py, models/mamba_transcriber.py,
      # models/_mamba_compat.py and the Mamba path in main.py, i.e. the code that
      # ships to every CPU user. See tests/conftest.py + tests/honesty.py.
      - name: Run tests (CPU, honesty gates on)
        run: pytest -m "not cuda" --strict-deps --fail-on-skip
      # Coverage gate is aspirational (T-8.4.1) and deliberately separate, so a
      # thin-coverage warning can never mask a failing assertion. Remove
      # `continue-on-error` once the number in .codecov.yml is reachable.
      - name: Coverage report
        run: pytest -m "not cuda" --cov=. --cov-report=xml --cov-report=term
        continue-on-error: true

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify structure
        run: python verify_structure.py
      - name: Check syntax
        run: python check_syntax.py

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers in all Python files
        shell: bash
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            if ! grep -q "SPDX-License-Identifier" "$f"; then
              echo "MISSING SPDX: $f"
              missing=1
            fi
          done < <(find . -path ./research -prune -o -name "*.py" -print0)
          exit $missing

  # ---------------------------------------------------------------------------
  # mamba-ssm tier — enabled when a CUDA/self-hosted runner exists.
  #
  # On CPU-only runners the real_mamba tests still run (against the pure-torch
  # shim in models/_mamba_compat.py), so this job adds *only* the parity check
  # between the shim and the Triton kernels plus the --require-mamba-ssm gate.
  # It is intentionally NOT `continue-on-error`: a job that cannot fail is how
  # the old `test-cpu` step reported green while the suite was broken.
  #
  # jobs.mamba-ssm:
  #   runs-on: [self-hosted, linux, gpu]
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with: { python-version: "3.13" }
  #     - run: pip install -r requirements.txt -r requirements-dev.txt
  #     - run: pip install mamba-ssm causal-conv1d
  #     - name: Parity + real-kernel inference
  #       run: pytest -m "cuda or requires_mamba_ssm" --require-mamba-ssm
  # ---------------------------------------------------------------------------
