name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint tools
        run: pip install ruff black mypy
      - name: Ruff
        run: ruff check .
      - name: Black (check)
        run: black --check .
      - name: Mypy (loose)
        run: mypy . || true

  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      # NOTE: coverage gate is aspirational (T-8.4.1); the current suite is thin,
      # so allow failure until coverage reaches 70%.
      - name: Run tests (CPU)
        run: pytest -m "not cuda" --cov=. --cov-fail-under=70
        continue-on-error: true

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify structure
        run: python verify_structure.py
      - name: Check syntax
        run: python check_syntax.py

  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SPDX headers in all Python files
        shell: bash
        run: |
          missing=0
          while IFS= read -r -d '' f; do
            if ! grep -q "SPDX-License-Identifier" "$f"; then
              echo "MISSING SPDX: $f"
              missing=1
            fi
          done < <(find . -path ./research -prune -o -name "*.py" -print0)
          exit $missing
