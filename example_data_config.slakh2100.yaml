# SPDX-License-Identifier: Apache-2.0
# Data Configuration for Stem+MIDI Pro — Slakh2100-YourMT3-16k (CC BY 4.0, commercial OK)
# Used by: python train.py --config configs/model_config.mamba.yaml --data-config example_data_config.slakh2100.yaml
# Layout expected (see https://www.slakh.com / Zenodo record 4599666):
#   <root_dir>/slakh2100_yourmt3/
#     train/
#       Track00001/
#         mix.wav
#         stems/
#           bass.wav drums.wav vocals.wav guitar.wav ...
#     val/
#     test/

dataset_type: slakh2100_yourmt3
root_dir: ./data

# DataLoader parameters (CPU target: 4-8 GB)
batch_size: 4
num_workers: 0

# Audio parameters
sample_rate: 44100
segment_length: 4.0

# Training parameters
train:
  n_steps: 100000
  lr: 3e-4
  grad_clip: 1.0
  device: cpu
  amp: false
  val_split: 0.1
  val_every: 2000
  ckpt_every: 1000
  log_every: 50
  early_stop_patience: 10