# Data configuration consumed by the root `train.py` entrypoint.
# `dataset_type: synthetic` explicitly selects generated samples, even if
# `root_dir` already exists. The research trainer has a separate CLI and does
# not load this file.

dataset_type: synthetic  # synthetic | slakh2100_yourmt3 | musdb18hq
root_dir: ./data

# DataLoader parameters
batch_size: 16
num_workers: 0

# Audio parameters
sample_rate: 44100
segment_length: 4.0

# For Slakh/MUSDB, place data under root_dir/<dataset_type>/{train,val,test}.
# The Slakh loader expects track folders with mix.wav and stems/; the MUSDB
# loader expects track folders with bass.wav, drums.wav, vocals.wav, other.wav.
